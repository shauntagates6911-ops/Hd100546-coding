<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HD 100546b Coding – Publish</title>
  <style>
    body {
      background: radial-gradient(circle at top, #330033, #000);
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
    }
    h1 { font-size: 3rem; color: #ff66ff; }
    .box {
      background: #ff66ff;
      padding: 20px;
      border-radius: 10px;
      color: #000;
      margin-top: 20px;
    }
    #preview {
      background: #fff;
      color: #000;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      background: #ff99ff;
      color: #000;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>

  <script>
    function loadProject() {
      const file = document.getElementById("file").files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        document.getElementById("preview").textContent = reader.result;
      };
      reader.readAsText(file);
    }

    function publishProject() {
      alert("Project published to HD 100546b Cosmic Network!");
    }
  </script>
</head>
<body>

<h1>Publish Project</h1>

<div class="box">
  <p>Select your project file:</p>
  <input type="file" id="file" onchange="loadProject()">
  <div id="preview">No project loaded.</div>
  <button onclick="publishProject()">Publish</button>
</div>

</body>
</html>
